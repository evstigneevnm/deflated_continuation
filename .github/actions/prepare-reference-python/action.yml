name: Prepare reference Python
description: Set up the hosted CPU config and the Python used for timestepper reference comparisons
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: .github/actions/prepare-reference-python/requirements.txt
    - name: Install reference wheels
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check --only-binary=:all: --timeout 15 --retries 2 \
          -r "$GITHUB_ACTION_PATH/requirements.txt"
        python -c 'import numpy, scipy, matplotlib'
        echo "PYTHON=$(command -v python)" >> "$GITHUB_ENV"
        echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
