            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev
          fi
      - name: Build and validate seeded fold continuation
        run: |
          BRATU_BUILD="$BUILD_DIR/bratu_bd_var_prec"
          make bratu_bd_var_prec CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BRATU_BUILD"
          python3 scripts/write_bratu_ci_config.py "$BRATU_BUILD/bratu_ci.json" "$BRATU_BUILD/project" --clean-project --steps 160 --step-size 0.03 --max-step-size 0.05
          timeout 120s ./"$BRATU_BUILD"/bratu_bd_var_prec.bin "$BRATU_BUILD/bratu_ci.json" --seed-exact-theta 1.0 --continue-seed-only --quiet
          python3 scripts/validate_bratu_diagram.py "$BRATU_BUILD/project" --config "$BRATU_BUILD/bratu_ci.json" --residual-tolerance 1e-5 --relation-tolerance 1e-2 --min-points 20 --min-saved-points 20 --expected-curves 1 --require-fold --min-max-u 2.0

  circle-bd-cuda:
    needs: [eigensolver-foundation-cuda, fft-facade-cuda, lapack-wrap-cuda]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build and validate when CUDA is available
        run: |
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA circle_bd: nvidia-smi not found"
            exit 0
          fi
          if ! nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA circle_bd: nvidia-smi is present but no usable NVIDIA device was reported"
            exit 0
          fi
          if ! command -v nvcc >/dev/null 2>&1 && [ ! -x /usr/local/cuda/bin/nvcc ]; then
            echo "Skipping CUDA circle_bd: nvcc not found"
            exit 0
          fi
          CIRCLE_BUILD="$BUILD_DIR/circle_bd_cuda"
          make circle_bd_cuda circle_stability_cuda CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$CIRCLE_BUILD" REAL_TYPE=double
          python3 scripts/write_circle_ci_config.py "$CIRCLE_BUILD/circle_ci.json" "$CIRCLE_BUILD/project" --clean-project --steps 340 --step-size 0.02 --max-step-size 0.04 --deflation-attempts 1 --continuation-fail-attempts 8 --knots -1.05 0.5 1.05
          timeout 120s ./"$CIRCLE_BUILD"/circle_bd_cuda.bin "$CIRCLE_BUILD/circle_ci.json" --seed-exact-curve 0.5 -1 --quiet
          python3 scripts/validate_circle_diagram.py "$CIRCLE_BUILD/project" --tolerance 1e-5 --min-points 100 --expected-curves 1 --require-closed-circle --min-angle-coverage 6.0 --max-closure-distance 1e-10
          timeout 120s ./"$CIRCLE_BUILD"/circle_stability_cuda.bin "$CIRCLE_BUILD/circle_ci.json" --quiet
          python3 scripts/validate_stability_diagram.py "$CIRCLE_BUILD/project" --expected-curves 1 --min-points 100 --require-complete --expected-bifurcations 2 --min-stable-points 20 --min-unstable-points 20 --expected-bifurcation-parameter=-1 --expected-bifurcation-parameter=1 --bifurcation-parameter-tolerance 2e-3
          cp "$CIRCLE_BUILD/project/stability_diagram.dat" "$CIRCLE_BUILD/stability_diagram.before_restart.dat"
          cp "$CIRCLE_BUILD/project/0/debug_curve_stability.dat" "$CIRCLE_BUILD/stability_curve.before_restart.dat"
          timeout 120s ./"$CIRCLE_BUILD"/circle_stability_cuda.bin "$CIRCLE_BUILD/circle_ci.json" --quiet
          cmp "$CIRCLE_BUILD/stability_diagram.before_restart.dat" "$CIRCLE_BUILD/project/stability_diagram.dat"
          cmp "$CIRCLE_BUILD/stability_curve.before_restart.dat" "$CIRCLE_BUILD/project/0/debug_curve_stability.dat"

