          else
            make test_KS1D_full_newton_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          fi
          timeout 60s ./"$KS1D_BUILD"/test_KS1D_full_newton_cpu_omp.bin

  ks1d-full-nmfd-newton-sanitizers-cpu-omp:
    name: Full KS1D / NMFD Newton sanitizers
    needs: ks1d-full-nmfd-newton-cpu-omp
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Prepare hosted CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
