          python3 scripts/validate_ks1d_zero_branch.py "$KS1D_BUILD/project" --min-points 10 --expected-curves 1 --max-reduced-norm 1e-9 --min-lambda-span 0.2
          make KS1D_stability_cpu_omp CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          timeout 300s ./"$KS1D_BUILD"/KS1D_stability_cpu_omp.bin "$KS1D_BUILD/ks1d_ci.json" --quiet
          python3 scripts/validate_stability_diagram.py "$KS1D_BUILD/project" --expected-curves 1 --min-points 10 --require-complete --require-plot-sidecar --expected-point-type stable --expected-unstable-real 0 --expected-unstable-complex-pairs 0
          cp "$KS1D_BUILD/project/stability_diagram.dat" "$KS1D_BUILD/stability_diagram.before_restart.dat"
          cp "$KS1D_BUILD/project/0/debug_curve_stability.dat" "$KS1D_BUILD/stability_curve.before_restart.dat"
          cp "$KS1D_BUILD/project/0/debug_curve_stability_plot.dat" "$KS1D_BUILD/stability_plot.before_restart.dat"
          timeout 300s ./"$KS1D_BUILD"/KS1D_stability_cpu_omp.bin "$KS1D_BUILD/ks1d_ci.json" --quiet
          cmp "$KS1D_BUILD/stability_diagram.before_restart.dat" "$KS1D_BUILD/project/stability_diagram.dat"
          cmp "$KS1D_BUILD/stability_curve.before_restart.dat" "$KS1D_BUILD/project/0/debug_curve_stability.dat"
          cmp "$KS1D_BUILD/stability_plot.before_restart.dat" "$KS1D_BUILD/project/0/debug_curve_stability_plot.dat"

      - name: Verify NMFD Newton selection, archived continuation, stability correction, restart and discovery
