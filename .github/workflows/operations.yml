name: Operations

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  CONFIG_FILE: build_configs/config_omen_home_release.inc
  BUILD_DIR: build/local_ci_operations
  SCFD_ROOT: ${{ github.workspace }}/source/contrib/scfd
  NMFD_OPERATIONS_ROOT: ${{ github.workspace }}/source/contrib/nmfd-operations
  NMFD_LINSOLVERS_ROOT: ${{ github.workspace }}/source/contrib/nmfd-linsolvers
  NMFD_TIMESTEPPERS_ROOT: ${{ github.workspace }}/source/contrib/nmfd-timesteppers

defaults:
  run:
    shell: bash

jobs:
  scalar-traits-cpu:
    name: Canonical scalar traits / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Prepare hosted dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libomp-dev libboost-dev
      - name: Verify scalar contracts and optional-header isolation
        run: |
          make -C source/contrib/scfd/test/utils test-scalar-traits test-boost-scalar-traits \
            CXX='${{ matrix.compiler }}' BUILD_DIR="$GITHUB_WORKSPACE/$BUILD_DIR/scalar_traits_${{ matrix.compiler }}"
      - name: Verify real and complex vector consumers
        run: |
          make -C source/contrib/nmfd-operations test-backend \
            CXX='${{ matrix.compiler }}' SCFD_ROOT="$SCFD_ROOT" \
            BUILD_DIR="$GITHUB_WORKSPACE/$BUILD_DIR/scalar_consumers_${{ matrix.compiler }}" OMP_NUM_THREADS=2

  operations-dependency-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify canonical operations dependencies
        run: |
          python3 -m unittest discover -s scripts/tests -p test_operations_dependencies.py
          python3 -m unittest discover -s scripts/tests -p test_nmfd_dependency_layout.py
          python3 -m unittest discover -s scripts/tests -p test_linear_solver_dependencies.py
          python3 -m unittest discover -s scripts/tests -p test_newton_solver_dependencies.py
          python3 -m unittest discover -s scripts/tests -p test_nmfd_standalone.py
          python3 -m unittest discover -s scripts/tests -p test_timestepper_extraction.py
          python3 -m unittest discover -s scripts/tests -p test_ks1d_reference.py
          python3 scripts/check_operations_dependencies.py
          python3 scripts/check_linear_solver_dependencies.py
          python3 scripts/check_newton_solver_dependencies.py
          git submodule status

  nmfd-standalone-cpu:
    name: Pinned standalone / ${{ matrix.library }} / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        library: [nmfd-operations, nmfd-linsolvers, nmfd-newton]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Prepare hosted compiler and optional test dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make libboost-dev nlohmann-json3-dev
            if [ '${{ matrix.compiler }}' = clang ]; then
              sudo apt-get install -y --no-install-recommends clang libomp-dev
            fi
          fi
      - name: Verify exact committed pins without parent build overrides
        run: |
          python3 scripts/validate_nmfd_standalone.py \
            --library '${{ matrix.library }}' --compiler '${{ matrix.compiler }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-${{ matrix.library }}-${{ matrix.compiler }}
          path: build/nmfd_standalone/*/report.json
          if-no-files-found: error

  nmfd-standalone-mpi:
    name: Pinned MPI / ${{ matrix.library }} / ${{ matrix.ranks }} ranks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        library: [nmfd-operations, nmfd-newton]
        ranks: [1, 2, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Prepare hosted MPI runtime
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make openmpi-bin libopenmpi-dev
          fi
      - name: Verify standalone distributed spaces and original CH programs
        env:
          MPIEXEC_FLAGS: --oversubscribe
        run: |
          python3 scripts/validate_nmfd_standalone.py \
            --library '${{ matrix.library }}' --suite mpi --mpi-ranks '${{ matrix.ranks }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-mpi-${{ matrix.library }}-${{ matrix.ranks }}
          path: build/nmfd_standalone/*/report.json
          if-no-files-found: error

  nmfd-migration-foundation-cpu:
    name: Linear-solver migration / foundation gates
    runs-on: ubuntu-latest
    needs:
      - scalar-traits-cpu
      - operations-dependency-boundaries
      - nmfd-standalone-cpu
      - nmfd-standalone-mpi
      - nmfd-newton-operations-cpu
      - nmfd-linsolvers-operations-cpu
      - nmfd-multiprecision-cpu
      - nmfd-sherman-morrison-cpu
      - nmfd-dense1-extended-cpu
      - nmfd-direct-solver-cpu
      - nmfd-newton-direct-solver-cpu
      - project-newton-fixed-parameter-sanitizers-cpu
      - project-newton-continuation-sanitizers-cpu
      - project-newton-deflation-sanitizers-cpu
      - project-newton-deflation-fixed-damping-sanitizers-cpu
      - project-newton-assembly-sanitizers-cpu
      - nmfd-newton-residual-norm-cpu
      - nmfd-short-recurrence-cpu
      - nmfd-short-recurrence-baseline-cpu
      - nmfd-legacy-linear-solve-recovery-cpu
      - nmfd-jacobi-cahn-hilliard-cpu
      - workflow-ownership-sanitizers-cpu
      - nmfd-newton-sanitizers-cpu
      - nmfd-cahn-hilliard-original
      - nmfd-cahn-hilliard-mpi
    steps:
      - run: echo "Required pinned, integration, solver, ownership and MPI gates passed."

  nmfd-migration-applications-cpu:
    name: Linear-solver migration / application gates
    runs-on: ubuntu-latest
    needs:
      - ks1d-nmfd-linear-solvers-cpu-omp
      - ks1d-full-nmfd-linear-solvers-cpu-omp
      - ks2d-nmfd-linear-solvers-cpu-omp
      - ks1d-sym-cpu-omp
      - ks1d-deflation-restart-cpu-omp
      - ks1d-full-cpu-omp
      - ks2d-cpu-omp
      - circle-bd-cpu-omp
      - circle-bd-full-cpu-omp
      - circle-bd-var-prec
      - bratu-bd-fd3-cpu-omp
      - bratu-bd-var-prec
      - star-shaped-bd-cpu-omp
      - star-shaped-bd-var-prec
    steps:
      - run: echo "Required continuation, stability, restart and multiprecision application gates passed."

  nmfd-migration-validation-cpu:
    name: Linear-solver migration / required CPU and MPI gates
    if: always()
    runs-on: ubuntu-latest
    needs: [nmfd-migration-foundation-cpu, nmfd-migration-applications-cpu]
    steps:
      - env:
          FOUNDATION_RESULT: ${{ needs.nmfd-migration-foundation-cpu.result }}
          APPLICATION_RESULT: ${{ needs.nmfd-migration-applications-cpu.result }}
        run: |
          test "$FOUNDATION_RESULT" = success
          test "$APPLICATION_RESULT" = success
          echo "All required pinned, integration, reference, sanitizer and MPI gates passed."
          echo "GPU runtime validation is recorded separately on available hardware."

  all-tests-passed:
    name: All preliminary tests passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Terminal jobs cover the entire preceding test graph, including matrices.
    # test_ks1d_reference.py rejects any test job omitted from this ancestry.
    needs:
      - bratu-bd-cpu-omp
      - circle-bd-cuda
      - circle-bd-hip
      - circle-newton-deflation-cpu-omp
      - fourier-discretization-cuda
      - ks1d-nmfd-newton-sanitizers-cpu-omp
      - ks1d-full-nmfd-newton-sanitizers-cpu-omp
      - ks1d-full-nmfd-newton-cuda
      - ks2d-nmfd-newton-sanitizers-cpu-omp
      - ks2d-nmfd-newton-cuda
      - ks1d-sym-cuda
      - ks1d-sym-hip
      - nmfd-direct-solver-cuda
      - nmfd-jacobi-cpu
      - nmfd-migration-validation-cpu
      - nmfd-newton-backend-cuda
      - nmfd-newton-backtracking-cpu
      - nmfd-newton-cahn-hilliard-cpu
      - nmfd-newton-convergence-cpu
      - nmfd-newton-linsolvers-cpu
      - nmfd-newton-short-recurrence-cpu
      - nmfd-operations-standalone-cpu
      - nmfd-scfd-dense-cuda
      - nmfd-vector-space-hierarchy-cpu
      - nmfd-vector-space-hierarchy-cuda
      - project-newton-assembly-cuda
      - project-newton-continuation-cuda
      - project-newton-continuation-operator-cuda
      - project-newton-deflation-cuda
      - project-newton-deflation-fixed-damping-cuda
      - project-newton-deflation-operator-cuda
      - project-newton-fixed-parameter-cuda
      - star-shaped-bd-cuda
      - star-shaped-bd-hip
      - timestepper-dense-output-cuda
      - timestepper-dense-output-lorenz-cpu
      - timestepper-dense-output-rk-cpu
      - timestepper-dense-output-rossler-cpu
      - timestepper-dense-output-vdp-cpu
      - timestepper-dop853-adaptive-cuda
      - timestepper-dop853-dense-cuda
      - timestepper-dop853-dense-python-cpu
      - timestepper-dop853-fixed-cuda
      - timestepper-explicit-nonautonomous-cuda
      - timestepper-explicit-rossler-cpu
      - timestepper-explicit-vdp-cpu
      - timestepper-fsal-cuda
      - timestepper-implicit-dirk-cuda
      - timestepper-implicit-lifecycle-cuda
      - timestepper-implicit-lorenz-cuda
      - timestepper-implicit-mass-dae-cuda
      - timestepper-implicit-nonautonomous-cuda
      - timestepper-implicit-rossler-cuda
      - timestepper-implicit-sanitizers-cpu
      - timestepper-implicit-vdp-cuda
      - timestepper-lorenz-simulation-python-cpu
      - timestepper-ownership-cuda
      - timestepper-rk4-simulation-python-cpu
      - timestepper-scipy-adaptation-cuda
      - workflow-ownership-cuda
    steps:
      - run: echo "All preliminary test jobs passed; N=64 reference validation may start."

  ks1d-n64-reference-cpu-omp:
    name: Symmetric KS1D / N=64 reference and unchanged restart
    needs: all-tests-passed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: 1
      OMP_DYNAMIC: "FALSE"
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make libboost-dev libboost-serialization-dev libfftw3-dev
          fi
      - name: Download pinned checksum-verified reference
        run: python3 scripts/download_reference_data.py --version 20260730 --destination "$BUILD_DIR/ks1d_n64_reference/asset"
      - name: Build production workflow and physical reference checker
        run: |
          make KS1D_bd_cpu_omp test_KS1D_reference_cpu_omp.bin \
            CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/ks1d_n64_reference" REAL_TYPE=double
      - name: Validate nine branches, residuals, endpoints and restart
        run: |
          python3 scripts/validate_ks1d_reference.py \
            --bd-executable "$BUILD_DIR/ks1d_n64_reference/KS1D_bd_cpu_omp.bin" \
            --checker-executable "$BUILD_DIR/ks1d_n64_reference/test_KS1D_reference_cpu_omp.bin" \
            --reference-dir "$BUILD_DIR/ks1d_n64_reference/asset/data/reference/KS1D/N64/symmetric" \
            --work-dir "$BUILD_DIR/ks1d_n64_reference/replay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ks1d-n64-reference
          path: |
            ${{ env.BUILD_DIR }}/ks1d_n64_reference/results.make
            ${{ env.BUILD_DIR }}/ks1d_n64_reference/replay/*.log
            ${{ env.BUILD_DIR }}/ks1d_n64_reference/replay/*.json
            ${{ env.BUILD_DIR }}/ks1d_n64_reference/replay/predictor_*.dat
            ${{ env.BUILD_DIR }}/ks1d_n64_reference/replay/project
          if-no-files-found: warn

  nmfd-newton-operations-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential make libboost-dev
      - name: Verify Newton with canonical parent dependencies
        run: |
          make -C source/contrib/nmfd-newton -j2 test_cpu check_headers_cpu \
            CONFIG_FILE=build_configs/config_cpu.inc \
            BUILD_DIR=build/operations_integration

  nmfd-newton-linsolvers-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify Newton linear-solver API and include-order independence
        run: |
          make -C source/contrib/nmfd-newton -j2 check_linsolvers \
            CONFIG_FILE=build_configs/config_cpu.inc \
            BUILD_DIR=build/linsolvers_interface

  nmfd-newton-cahn-hilliard-cpu:
    name: Cahn-Hilliard / ${{ matrix.backend }} / NMFD-linsolvers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        backend: [serial, omp]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify coupled Cahn-Hilliard Newton solves
        run: |
          make -C source/contrib/nmfd-newton -j2 'check_ch_${{ matrix.backend }}' \
            CONFIG_FILE=build_configs/config_cpu.inc \
            BUILD_DIR=build/ch_solver_interface

  nmfd-linsolvers-operations-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify linear solvers with canonical parent dependencies
        run: |
          make -C source/contrib/nmfd-linsolvers -j2 check_operations_cpu check_public_headers_cpu check_block_schur_cpu \
            CONFIG_FILE=build_configs/config_github_ubuntu_gcc.inc \
            BUILD_DIR=build/operations_integration TEST_OMP_NUM_THREADS=2

  nmfd-sherman-morrison-cpu:
    name: Sherman-Morrison / ordinary, rank-one and scalar-border
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify analytical solves, failure reporting and ownership
        run: |
          make -C source/contrib/nmfd-linsolvers check_sherman_morrison_cpu \
            CONFIG_FILE=build_configs/config_github_ubuntu_gcc.inc \
            BUILD_DIR=build/sherman_morrison TEST_OMP_NUM_THREADS=2
      - name: Verify project recovery with migrated ordinary and extended solves
        run: |
          make test_linear_solve_recovery.bin \
            CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc \
            BUILD_DIR=build/sherman_morrison_recovery
          timeout 30s build/sherman_morrison_recovery/test_linear_solve_recovery.bin

  nmfd-legacy-linear-solve-recovery-cpu:
    name: Archived solver / recovery compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify legacy preconditioner bypass and restoration
        run: |
          make test_legacy_linear_solve_recovery.bin \
            CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc \
            BUILD_DIR=build/legacy_solver_recovery
          timeout 30s build/legacy_solver_recovery/test_legacy_linear_solve_recovery.bin

  nmfd-multiprecision-cpu:
    name: Multiprecision / dense and bordered linear solves
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Prepare optional Boost headers
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make libboost-dev
          fi
      - name: Verify precision, true residuals, failure reporting and ownership
        run: |
          make -C source/contrib/nmfd-operations test-multiprecision \
            CONFIG_FILE=build_configs/config_cpu.inc BUILD_DIR=build/multiprecision
          make -C source/contrib/nmfd-linsolvers check_multiprecision_cpu \
            CONFIG_FILE=build_configs/config_github_ubuntu_gcc.inc \
            BUILD_DIR=build/multiprecision TEST_OMP_NUM_THREADS=2
          make test_newton_multiprecision_cpu.bin CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc BUILD_DIR="$BUILD_DIR/newton_multiprecision"
          timeout 60s ./"$BUILD_DIR/newton_multiprecision/test_newton_multiprecision_cpu.bin"

  nmfd-dense1-extended-cpu:
    name: Extended solver / assembled reference and rebinding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify the canonical extended solver
        run: |
          make -C source/contrib/nmfd-linsolvers check_dense1_extended_solver_cpu \
            CONFIG_FILE=build_configs/config_github_ubuntu_gcc.inc \
            BUILD_DIR=build/dense1_extended TEST_OMP_NUM_THREADS=2

  nmfd-dense-solve-cpu:
    name: Dense operations / direct solve and numerical failures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify CPU and OMP dense solves
        run: |
          make -C source/contrib/nmfd-operations test-dense \
            CONFIG_FILE=build_configs/config_cpu.inc \
            BUILD_DIR=build/dense_solve OMP_NUM_THREADS=2

  nmfd-direct-solver-cpu:
    name: Direct solver / ordinary, rank-one and scalar-border
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify residuals, failure rollback and ownership
        run: |
          make -C source/contrib/nmfd-linsolvers check_direct_solver_cpu \
            CONFIG_FILE=build_configs/config_github_ubuntu_gcc.inc \
            BUILD_DIR=build/direct_solver TEST_OMP_NUM_THREADS=2

  nmfd-newton-direct-solver-cpu:
    name: Newton / canonical direct solver
    needs: nmfd-direct-solver-cpu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify nonlinear convergence, linear failure and recovery
        run: |
          make test_nmfd_newton_direct_solver_cpu.bin \
            CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc BUILD_DIR=build/newton_direct
          timeout 30s build/newton_direct/test_nmfd_newton_direct_solver_cpu.bin

  project-newton-fixed-parameter-cpu:
    name: Project Newton / fixed-parameter operator and circle
    needs: [nmfd-newton-backend-cpu-omp, nmfd-short-recurrence-cpu]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify Jacobians, roots, retries, rollback and ownership
        run: |
          make test_fixed_parameter_newton_cpu.bin test_fixed_parameter_newton_cpu_omp.bin \
            CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc BUILD_DIR=build/newton_fixed_parameter
          timeout 60s build/newton_fixed_parameter/test_fixed_parameter_newton_cpu.bin
          OMP_NUM_THREADS=2 timeout 60s build/newton_fixed_parameter/test_fixed_parameter_newton_cpu_omp.bin

  project-newton-fixed-parameter-sanitizers-cpu:
    name: Project Newton / fixed-parameter sanitizers
    needs: project-newton-fixed-parameter-cpu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify fixed-parameter workspace and dependency lifetimes
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make test_fixed_parameter_newton_cpu.bin \
            CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc BUILD_DIR=build/newton_fixed_parameter_sanitizers \
            NEWTON_TEST_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
          timeout 60s build/newton_fixed_parameter_sanitizers/test_fixed_parameter_newton_cpu.bin

  project-newton-fixed-parameter-cuda:
    name: Project Newton / fixed-parameter CUDA
    needs: [project-newton-fixed-parameter-cpu, scfd-vector-operations-cuda]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify fixed-parameter Newton on CUDA when available
        run: |
          if ! command -v nvidia-smi >/dev/null 2>&1 || ! nvidia-smi -L >/dev/null 2>&1; then
            echo "Skipping CUDA fixed-parameter Newton: no usable GPU"
            exit 0
          fi
          if ! command -v nvcc >/dev/null 2>&1; then
            echo "Skipping CUDA fixed-parameter Newton: nvcc unavailable"
            exit 0
          fi
          make test_fixed_parameter_newton_cuda.bin \
            CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc BUILD_DIR=build/newton_fixed_parameter_cuda
          timeout 120s build/newton_fixed_parameter_cuda/test_fixed_parameter_newton_cuda.bin

  project-newton-continuation-operator-cpu:
    name: Project Newton / continuation operator
    needs: project-newton-fixed-parameter-cpu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify arclength, chart derivatives, frozen contexts and construction
        run: |
          make test_continuation_operator_cpu.bin test_continuation_operator_cpu_omp.bin \
            CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc BUILD_DIR=build/newton_continuation_operator
          timeout 60s build/newton_continuation_operator/test_continuation_operator_cpu.bin
          OMP_NUM_THREADS=2 timeout 60s build/newton_continuation_operator/test_continuation_operator_cpu_omp.bin

  project-newton-continuation-cpu:
    name: Project Newton / continuation corrections
    needs: [project-newton-continuation-operator-cpu, nmfd-sherman-morrison-cpu]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify folds, bordered residuals, recovery, rollback and ownership
        run: |
          make test_continuation_newton_cpu.bin test_continuation_newton_cpu_omp.bin \
            test_continuation_augmented_cpu.bin test_continuation_augmented_cpu_omp.bin \
            CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc BUILD_DIR=build/newton_continuation
          timeout 60s build/newton_continuation/test_continuation_newton_cpu.bin
          OMP_NUM_THREADS=2 timeout 60s build/newton_continuation/test_continuation_newton_cpu_omp.bin
          timeout 60s build/newton_continuation/test_continuation_augmented_cpu.bin
          OMP_NUM_THREADS=2 timeout 60s build/newton_continuation/test_continuation_augmented_cpu_omp.bin

  project-newton-continuation-operator-cuda:
    name: Project Newton / continuation operator CUDA
    needs: [project-newton-continuation-operator-cpu, scfd-vector-operations-cuda]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify continuation operator on CUDA when available
        run: |
