  ks2d-cpu-omp:
    needs: [fourier-discretization-cpu, eigensolver-foundation-cpu, ks2d-nmfd-newton-cpu-omp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 python3-numpy python3-matplotlib libboost-dev libboost-serialization-dev libfftw3-dev libopenblas-dev
          fi
      - name: Build and test KS2D nonlinear, Jacobian-adjoint, and preconditioner-adjoint operators
        run: |
          export OMP_NUM_THREADS=8
          KS2D_BUILD="$BUILD_DIR/ks2d_cpu_omp"
          make test_KS2D_operator_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS2D_BUILD" REAL_TYPE=double
          ./"$KS2D_BUILD"/test_KS2D_operator_cpu_omp.bin
      - name: Validate KS2D analytical branch and visualization
        run: |
          export OMP_NUM_THREADS=8
          KS2D_BUILD="$BUILD_DIR/ks2d_cpu_omp"
          make test_numpy_array_writer.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS2D_BUILD" REAL_TYPE=double
          ./"$KS2D_BUILD"/test_numpy_array_writer.bin
          PLOT_PYTHON=python3
          if ! "$PLOT_PYTHON" -c 'import matplotlib, numpy' >/dev/null 2>&1; then
            if [ -x "$HOME/anaconda3/bin/python" ]; then
              PLOT_PYTHON="$HOME/anaconda3/bin/python"
            else
              echo "NumPy and Matplotlib are required for the KS2D visualization test" >&2
              exit 1
            fi
          fi
          MPLCONFIGDIR="$KS2D_BUILD/matplotlib" "$PLOT_PYTHON" plot_scripts/tests/test_plot_bd_solutions.py
          make KS2D_bd_cpu_omp CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS2D_BUILD" REAL_TYPE=double
          python3 scripts/write_ks2d_ci_config.py "$KS2D_BUILD/ks2d_ci.json" "$KS2D_BUILD/project" --clean-project --nx 12 --ny 12 --steps 8
          timeout 120s ./"$KS2D_BUILD"/KS2D_bd_cpu_omp.bin "$KS2D_BUILD/ks2d_ci.json" --seed-zero 2.0 --continue-seed-only --quiet
          python3 scripts/validate_symmetry_group_manifest.py "$KS2D_BUILD/project" --expected-order 8
          python3 scripts/validate_ks1d_zero_branch.py "$KS2D_BUILD/project" --min-points 10 --expected-curves 1 --max-reduced-norm 1e-9 --min-lambda-span 0.2
          make KS2D_prepare_visualization_cpu_omp CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS2D_BUILD" REAL_TYPE=double
          ./"$KS2D_BUILD"/KS2D_prepare_visualization_cpu_omp.bin "$KS2D_BUILD/ks2d_ci.json" --output-dir "$KS2D_BUILD/visualization" --branch 0 --max-points 1 --quiet
          python3 scripts/validate_ks2d_visualization.py "$KS2D_BUILD/visualization/manifest.jsonl" --nx 12 --ny 12 --expected-backend scfd_omp_fftw --maximum-absolute-value 1e-12
      - name: Validate KS2D stability analysis
        run: |
          export OMP_NUM_THREADS=8
          KS2D_BUILD="$BUILD_DIR/ks2d_cpu_omp"
          make test_KS2D_stability_cli.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS2D_BUILD" REAL_TYPE=double
          ./"$KS2D_BUILD"/test_KS2D_stability_cli.bin
          make KS2D_stability_cpu_omp CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS2D_BUILD" REAL_TYPE=double
          timeout 180s ./"$KS2D_BUILD"/KS2D_stability_cpu_omp.bin "$KS2D_BUILD/ks2d_ci.json" --quiet
          python3 scripts/validate_stability_diagram.py "$KS2D_BUILD/project" --expected-curves 1 --min-points 10 --require-complete --require-plot-sidecar --expected-point-type stable --expected-unstable-real 0 --expected-unstable-complex-pairs 0
          KS2D_REPLAY_OUTPUT=$(timeout 180s ./"$KS2D_BUILD"/KS2D_stability_cpu_omp.bin "$KS2D_BUILD/ks2d_ci.json" --state-file "$KS2D_BUILD/project/0/1" --parameter 30 --quiet)
          printf '%s\n' "$KS2D_REPLAY_OUTPUT"
          grep -Fq 'unstable=(10,0)' <<<"$KS2D_REPLAY_OUTPUT"
      - name: Validate KS2D nontrivial deflation and continuation
        run: |
          export OMP_NUM_THREADS=8
          KS2D_BUILD="$BUILD_DIR/ks2d_cpu_omp"
          python3 scripts/write_ks2d_ci_config.py "$KS2D_BUILD/ks2d_nontrivial_ci.json" "$KS2D_BUILD/project_nontrivial" --clean-project --nx 12 --ny 16 --steps 20 --step-size 2 --max-step-size 5 --skip-file-output 5 --seed-parameter 4.333 --parameter-min 3.99 --parameter-max 4.4 --deflation-attempts 1 --newton-deflation-iterations 80 --newton-deflation-weight 0.5 --newton-deflation-tolerance 1e-8 --linear-solver-iterations 150 --linear-solver-tolerance 1e-3 --add-analytical-solution --enable-branch-intersections --enable-seed-schedule --max-failed-continuations-per-knot 1
          timeout 120s ./"$KS2D_BUILD"/KS2D_bd_cpu_omp.bin "$KS2D_BUILD/ks2d_nontrivial_ci.json" --quiet
          python3 scripts/validate_ks2d_nontrivial_branch.py "$KS2D_BUILD/project_nontrivial" --seed-parameter 4.333 --minimum-norm 1e-3

      - name: Replay KS2D NMFD reference curve, stability restart, and Newton fallback
        run: |
          export OMP_NUM_THREADS=2 OMP_DYNAMIC=FALSE OPENBLAS_NUM_THREADS=1
          KS2D_BUILD="$BUILD_DIR/ks2d_cpu_omp"
          python3 scripts/test_ks2d_nmfd.py --bd-executable "$KS2D_BUILD/KS2D_bd_cpu_omp.bin" --stability-executable "$KS2D_BUILD/KS2D_stability_cpu_omp.bin" --work-dir "$KS2D_BUILD/nonzero_nmfd"

