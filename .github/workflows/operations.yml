          export OMP_NUM_THREADS=2 OMP_DYNAMIC=FALSE OPENBLAS_NUM_THREADS=1
          KS1D_BUILD="$BUILD_DIR/ks1d_sym_cpu_omp"
          python3 scripts/test_ks1d_symmetric_nmfd.py --bd-executable "$KS1D_BUILD/KS1D_bd_cpu_omp.bin" --stability-executable "$KS1D_BUILD/KS1D_stability_cpu_omp.bin" --work-dir "$KS1D_BUILD/nonzero_replay"

