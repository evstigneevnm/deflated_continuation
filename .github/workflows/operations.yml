name: Operations

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  CONFIG_FILE: build_configs/config_omen_home_release.inc
  BUILD_DIR: build/local_ci_operations

defaults:
  run:
    shell: bash

jobs:
  cpu-vector-operations-var-prec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev
          fi
      - name: Build
        run: make test_cpu_vector_operations_var_prec.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR"
      - name: Test
        run: ./"$BUILD_DIR"/test_cpu_vector_operations_var_prec.bin

  scfd-vector-operations-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev
          fi
      - name: Build and test double
        run: |
          make scfd_vector_operations_cpu.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/scfd_cpu_double" REAL_TYPE=double
          ./"$BUILD_DIR"/scfd_cpu_double/test_scfd_vector_operations_cpu.bin
      - name: Build and test float
        run: |
          make scfd_vector_operations_cpu.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/scfd_cpu_float" REAL_TYPE=float
          ./"$BUILD_DIR"/scfd_cpu_float/test_scfd_vector_operations_cpu.bin

  continuation-core-cpu:
    needs: [scfd-vector-operations-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev
          fi
      - name: Build and test continuation chart helpers
        run: |
          make test_continuation_chart_helpers.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/continuation_chart_helpers"
          ./"$BUILD_DIR"/continuation_chart_helpers/test_continuation_chart_helpers.bin
      - name: Build and test predictor chart validation
        run: |
          make test_predictor_chart_validation.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/predictor_chart_validation"
          ./"$BUILD_DIR"/predictor_chart_validation/test_predictor_chart_validation.bin
          make test_predictor_chart_probe.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/predictor_chart_probe"
          ./"$BUILD_DIR"/predictor_chart_probe/test_predictor_chart_probe.bin
          make test_advance_solution_chart_retry.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/advance_solution_chart_retry"
          ./"$BUILD_DIR"/advance_solution_chart_retry/test_advance_solution_chart_retry.bin
          make test_continuation_retry_progress.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/continuation_retry_progress"
          ./"$BUILD_DIR"/continuation_retry_progress/test_continuation_retry_progress.bin
          make test_initial_tangent_components.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/initial_tangent_components"
          ./"$BUILD_DIR"/initial_tangent_components/test_initial_tangent_components.bin
          make test_continuation_event_state.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/continuation_event_state"
          ./"$BUILD_DIR"/continuation_event_state/test_continuation_event_state.bin
          make test_observational_knot_sample.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/observational_knot_sample"
          ./"$BUILD_DIR"/observational_knot_sample/test_observational_knot_sample.bin
          make test_branch_intersection_policy.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/branch_intersection_policy"
          ./"$BUILD_DIR"/branch_intersection_policy/test_branch_intersection_policy.bin
          make test_symmetry_event_persistence.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/symmetry_event_persistence"
          ./"$BUILD_DIR"/symmetry_event_persistence/test_symmetry_event_persistence.bin
          make test_parameters_json.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/parameters_json"
          ./"$BUILD_DIR"/parameters_json/test_parameters_json.bin
          make test_solver_bundle.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/solver_bundle"
          ./"$BUILD_DIR"/solver_bundle/test_solver_bundle.bin
          make test_parameter_application.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/parameter_application"
          ./"$BUILD_DIR"/parameter_application/test_parameter_application.bin
          make test_rejected_candidate_cache.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/rejected_candidate_cache"
          ./"$BUILD_DIR"/rejected_candidate_cache/test_rejected_candidate_cache.bin
          make test_exact_solution_registry.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/exact_solution_registry"
          ./"$BUILD_DIR"/exact_solution_registry/test_exact_solution_registry.bin
          make test_knot_relocation_controller.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/knot_relocation_controller"
          ./"$BUILD_DIR"/knot_relocation_controller/test_knot_relocation_controller.bin
          make test_analytical_branch_executor.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/analytical_branch_executor"
          ./"$BUILD_DIR"/analytical_branch_executor/test_analytical_branch_executor.bin
          make test_knot_executor.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/knot_executor"
          ./"$BUILD_DIR"/knot_executor/test_knot_executor.bin
          make test_deflation_seed_registry.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/deflation_seed_registry"
          ./"$BUILD_DIR"/deflation_seed_registry/test_deflation_seed_registry.bin
          make test_linear_solve_recovery.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/linear_solve_recovery"
          ./"$BUILD_DIR"/linear_solve_recovery/test_linear_solve_recovery.bin
          make test_curve_metadata_io.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/curve_metadata_io"
          ./"$BUILD_DIR"/curve_metadata_io/test_curve_metadata_io.bin
          make test_curve_vector_store.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/curve_vector_store"
          ./"$BUILD_DIR"/curve_vector_store/test_curve_vector_store.bin
          make test_curve_interpolator.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/curve_interpolator"
          ./"$BUILD_DIR"/curve_interpolator/test_curve_interpolator.bin
          make test_curve_intersection_search.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/curve_intersection_search"
          ./"$BUILD_DIR"/curve_intersection_search/test_curve_intersection_search.bin
          make test_diagram_archive.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/diagram_archive"
          ./"$BUILD_DIR"/diagram_archive/test_diagram_archive.bin
          make test_stability_diagram_archive.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/stability_diagram_archive"
          ./"$BUILD_DIR"/stability_diagram_archive/test_stability_diagram_archive.bin
          python3 plot_scripts/tests/test_plot_stability.py
          make test_symmetry_event_registry_sync.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/symmetry_event_registry_sync"
          ./"$BUILD_DIR"/symmetry_event_registry_sync/test_symmetry_event_registry_sync.bin

  symmetry-foundation-cpu:
    needs: [scfd-vector-operations-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3
          fi
      - name: Build and test
        run: |
          make test_small_dense_linalg.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/small_dense_linalg"
          ./"$BUILD_DIR"/small_dense_linalg/test_small_dense_linalg.bin
          make test_complex_traits.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/complex_traits"
          ./"$BUILD_DIR"/complex_traits/test_complex_traits.bin
          make test_fourier_mode_primitives.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/fourier_mode_primitives"
          ./"$BUILD_DIR"/fourier_mode_primitives/test_fourier_mode_primitives.bin
          make test_quotient_classifier.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/quotient_classifier"
          ./"$BUILD_DIR"/quotient_classifier/test_quotient_classifier.bin
          make test_fourier_slice_1d.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/fourier_slice_1d"
          ./"$BUILD_DIR"/fourier_slice_1d/test_fourier_slice_1d.bin
          make test_real_packed_fourier_canonical_adapter.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/real_packed_fourier_canonical_adapter"
          ./"$BUILD_DIR"/real_packed_fourier_canonical_adapter/test_real_packed_fourier_canonical_adapter.bin
          make test_fourier_isotropy_transition.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/fourier_isotropy_transition"
          ./"$BUILD_DIR"/fourier_isotropy_transition/test_fourier_isotropy_transition.bin
          make test_fourier_slice_differential_1d.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/fourier_slice_differential_1d"
          ./"$BUILD_DIR"/fourier_slice_differential_1d/test_fourier_slice_differential_1d.bin
          make test_frozen_fourier_chart_1d.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/frozen_fourier_chart_1d"
          ./"$BUILD_DIR"/frozen_fourier_chart_1d/test_frozen_fourier_chart_1d.bin
          make test_stabilized_storage.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/stabilized_storage"
          ./"$BUILD_DIR"/stabilized_storage/test_stabilized_storage.bin
          make test_symmetry_solution_storage.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/symmetry_solution_storage" REAL_TYPE=double
          ./"$BUILD_DIR"/symmetry_solution_storage/test_symmetry_solution_storage.bin

  fftw-operations-cpu:
    needs: [symmetry-foundation-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libfftw3-dev
          fi
      - name: Build and test
        run: |
          make test_fftw_operations.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/fftw_operations"
          ./"$BUILD_DIR"/fftw_operations/test_fftw_operations.bin
          make test_fft_facade_fftw.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/fft_facade_fftw"
          ./"$BUILD_DIR"/fft_facade_fftw/test_fft_facade_fftw.bin

  lapack-wrap-cpu:
    needs: [scfd-vector-operations-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libopenblas-dev
          fi
      - name: Build and test
        run: |
          make test_lapack_wrap.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/lapack_wrap"
          ./"$BUILD_DIR"/lapack_wrap/test_lapack_wrap.bin

  eigensolver-foundation-cpu:
    needs: [scfd-vector-operations-cpu, lapack-wrap-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev libopenblas-dev
          fi
      - name: Build and test Matrix Market foundation
        run: |
          make test_matrix_market.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_matrix_market"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_matrix_market/test_matrix_market.bin
          make test_matrix_market_report_data_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_report_data"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_report_data/test_matrix_market_report_data_cpu_omp.bin
      - name: Build and test eigensolver foundation
        run: |
          make test_host_small_dense_backend.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_dense"
          ./"$BUILD_DIR"/eigensolver_dense/test_host_small_dense_backend.bin
          make test_analytical_eigenproblems.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_analytical"
          ./"$BUILD_DIR"/eigensolver_analytical/test_analytical_eigenproblems.bin
          make test_direct_and_dense_eigensolvers_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_direct_dense"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_direct_dense/test_direct_and_dense_eigensolvers_cpu_omp.bin
          make test_scalar_affine_inverse_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/stability_scalar_affine"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/stability_scalar_affine/test_scalar_affine_inverse_cpu_omp.bin
          make test_bratu_stability_operators_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/stability_bratu_operators"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/stability_bratu_operators/test_bratu_stability_operators_cpu_omp.bin
          make test_stability_analysis_pipeline_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/stability_analysis"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/stability_analysis/test_stability_analysis_pipeline_cpu_omp.bin
          make test_spectrum_scan_aggregator.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/stability_scan_aggregation"
          ./"$BUILD_DIR"/stability_scan_aggregation/test_spectrum_scan_aggregator.bin
          make test_eigenvector_rank_aggregator_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/stability_rank_aggregation"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/stability_rank_aggregation/test_eigenvector_rank_aggregator_cpu_omp.bin
          make test_matrix_free_stability_configuration.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/stability_scan_configuration"
          ./"$BUILD_DIR"/stability_scan_configuration/test_matrix_free_stability_configuration.bin
          make test_stability_continuation_interface_cpu.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/stability_continuation_interface"
          ./"$BUILD_DIR"/stability_continuation_interface/test_stability_continuation_interface_cpu.bin
          make test_shared_arnoldi_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_arnoldi"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_arnoldi/test_shared_arnoldi_cpu_omp.bin
          make test_inverse_iteration_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_inverse_iteration"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_inverse_iteration/test_inverse_iteration_cpu_omp.bin
          make test_krylov_schur_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_krylov_schur"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_krylov_schur/test_krylov_schur_cpu_omp.bin
          make test_projected_spectrum_recovery_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_projected_recovery"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_projected_recovery/test_projected_spectrum_recovery_cpu_omp.bin
      - name: Build and test transformed eigensolver operators
        run: |
          make test_product_vector_space_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_product_space"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_product_space/test_product_vector_space_cpu_omp.bin
          make test_nmfd_gmres_shared_krylov_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_shared_gmres"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_shared_gmres/test_nmfd_gmres_shared_krylov_cpu_omp.bin
          make test_transformed_operators_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_transformations"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_transformations/test_transformed_operators_cpu_omp.bin
          make test_transformed_operators_gmres_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_transformations_gmres"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_transformations_gmres/test_transformed_operators_gmres_cpu_omp.bin
          make test_factorized_inverse_solver_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_factorized_inverse"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_factorized_inverse/test_factorized_inverse_solver_cpu_omp.bin
          make test_stability_polynomial_operator_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_stability_polynomial"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_stability_polynomial/test_stability_polynomial_operator_cpu_omp.bin
          make test_complex_solver_product_adapter_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_complex_adapter"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_complex_adapter/test_complex_solver_product_adapter_cpu_omp.bin
          make test_complex_affine_transformations_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_complex_affine"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_complex_affine/test_complex_affine_transformations_cpu_omp.bin
          make test_iterative_factor_solver_bundle_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_factor_bundle"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_factor_bundle/test_iterative_factor_solver_bundle_cpu_omp.bin
          make test_matrix_free_complexification_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_matrix_free_complex"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_matrix_free_complex/test_matrix_free_complexification_cpu_omp.bin
          make test_matrix_free_factorized_krylov_schur_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_matrix_free_factorized"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_matrix_free_factorized/test_matrix_free_factorized_krylov_schur_cpu_omp.bin
      - name: Validate Eigs_Paper Matrix Market cases
        run: |
          make test_krylov_schur_rdb450_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_rdb450"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_rdb450/test_krylov_schur_rdb450_cpu_omp.bin
          make test_transformed_krylov_schur_rdb450_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_rdb450_transformed"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_rdb450_transformed/test_transformed_krylov_schur_rdb450_cpu_omp.bin
          make characterize_krylov_schur_S80PI_n1_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_S80PI_n1"
          OMP_NUM_THREADS=8 ./"$BUILD_DIR"/eigensolver_S80PI_n1/characterize_krylov_schur_S80PI_n1_cpu_omp.bin

  eigensolver-foundation-cuda:
    needs: [eigensolver-foundation-cpu, scfd-vector-operations-cuda]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build and test CUDA eigensolver foundations when available
        run: |
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA eigensolver recovery: nvidia-smi not found"
            exit 0
          fi
          if ! nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA eigensolver recovery: no usable NVIDIA device was reported"
            exit 0
          fi
          if ! command -v nvcc >/dev/null 2>&1 && [ ! -x /usr/local/cuda/bin/nvcc ]; then
            echo "Skipping CUDA eigensolver recovery: nvcc not found"
            exit 0
          fi
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libopenblas-dev
          fi
          make test_projected_spectrum_recovery_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_projected_recovery_cuda"
          ./"$BUILD_DIR"/eigensolver_projected_recovery_cuda/test_projected_spectrum_recovery_cuda.bin auto
          make test_stability_analysis_pipeline_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/stability_analysis_cuda"
          ./"$BUILD_DIR"/stability_analysis_cuda/test_stability_analysis_pipeline_cuda.bin auto
          make test_scalar_affine_inverse_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/stability_scalar_affine_cuda"
          ./"$BUILD_DIR"/stability_scalar_affine_cuda/test_scalar_affine_inverse_cuda.bin auto
          make test_complex_affine_transformations_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_complex_affine_cuda"
          ./"$BUILD_DIR"/eigensolver_complex_affine_cuda/test_complex_affine_transformations_cuda.bin auto
          make test_iterative_factor_solver_bundle_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_factor_bundle_cuda"
          ./"$BUILD_DIR"/eigensolver_factor_bundle_cuda/test_iterative_factor_solver_bundle_cuda.bin auto
          make test_matrix_free_complexification_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_matrix_free_complex_cuda"
          ./"$BUILD_DIR"/eigensolver_matrix_free_complex_cuda/test_matrix_free_complexification_cuda.bin auto
          make test_matrix_free_factorized_krylov_schur_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/eigensolver_matrix_free_factorized_cuda"
          ./"$BUILD_DIR"/eigensolver_matrix_free_factorized_cuda/test_matrix_free_factorized_krylov_schur_cuda.bin auto

  lapack-wrap-cuda:
    needs: [scfd-vector-operations-cuda, lapack-wrap-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build and test when CUDA is available
        run: |
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA LAPACK wrapper: nvidia-smi not found"
            exit 0
          fi
          if ! nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA LAPACK wrapper: nvidia-smi is present but no usable NVIDIA device was reported"
            exit 0
