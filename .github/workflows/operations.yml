            NEWTON_TEST_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
          timeout 60s ./"$KS1D_BUILD"/test_KS1D_full_newton_cpu_omp.bin

  ks1d-full-nmfd-newton-cuda:
    name: Full KS1D / NMFD Newton CUDA
    needs: [ks1d-full-nmfd-newton-cpu-omp, fft-facade-cuda]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify projected correction bindings on CUDA when available
        run: |
          if ! command -v nvidia-smi >/dev/null 2>&1 || ! nvidia-smi -L >/dev/null 2>&1; then
            echo "Skipping CUDA full KS1D Newton: no usable GPU"
            exit 0
          fi
          if ! command -v nvcc >/dev/null 2>&1 && [ ! -x /usr/local/cuda/bin/nvcc ]; then
            echo "Skipping CUDA full KS1D Newton: nvcc unavailable"
            exit 0
          fi
          KS1D_BUILD="$BUILD_DIR/ks1d_full_newton_cuda"
          make test_KS1D_full_newton_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          timeout 120s ./"$KS1D_BUILD"/test_KS1D_full_newton_cuda.bin

  ks1d-full-cpu-omp:
    needs: [continuation-core-cpu, fftw-operations-cpu, eigensolver-foundation-cpu, ks1d-full-nmfd-newton-cpu-omp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev libfftw3-dev libopenblas-dev
          fi
      - name: Build and validate full Fourier KS1D and its Jacobian/preconditioner adjoints
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            KS1D_OMP_THREADS="$(nproc)"
            if [ "$KS1D_OMP_THREADS" -gt 4 ]; then
              KS1D_OMP_THREADS=4
            fi
            export OMP_NUM_THREADS="$KS1D_OMP_THREADS"
          else
            export OMP_NUM_THREADS="${OMP_NUM_THREADS:-8}"
          fi
          export OMP_DYNAMIC=FALSE
          export OPENBLAS_NUM_THREADS=1
          echo "KS1D CI threads: OMP=$OMP_NUM_THREADS, OpenBLAS=$OPENBLAS_NUM_THREADS"
          KS1D_BUILD="$BUILD_DIR/ks1d_full_cpu_omp"
          make KS1D_full_operator_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          ./"$KS1D_BUILD"/test_KS1D_full_operator_cpu_omp.bin
          make KS1D_stability_scan_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          ./"$KS1D_BUILD"/test_KS1D_stability_scan_cpu_omp.bin
          make KS1D_full_bd_cpu_omp CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          python3 scripts/write_ks1d_ci_config.py "$KS1D_BUILD/ks1d_full_ci.json" "$KS1D_BUILD/project_full" --base-config json_project_files/KS1D_test_full.json --clean-project --steps 6 --step-size 0.02 --max-step-size 0.03
          timeout 120s ./"$KS1D_BUILD"/KS1D_full_bd_cpu_omp.bin "$KS1D_BUILD/ks1d_full_ci.json" --quiet
          python3 scripts/validate_ks1d_zero_branch.py "$KS1D_BUILD/project_full" --min-points 10 --expected-curves 1 --max-reduced-norm 1e-9 --min-lambda-span 0.2
          make KS1D_full_stability_cpu_omp CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          python3 scripts/test_ks1d_full_stability_replay.py --executable "$KS1D_BUILD/KS1D_full_stability_cpu_omp.bin" --config json_project_files/KS1D_test_full.json --timeout 180
          timeout 300s ./"$KS1D_BUILD"/KS1D_full_stability_cpu_omp.bin "$KS1D_BUILD/ks1d_full_ci.json" --quiet
          python3 scripts/validate_stability_diagram.py "$KS1D_BUILD/project_full" --expected-curves 1 --min-points 10 --require-complete --require-plot-sidecar --expected-point-type stable --expected-unstable-real 0 --expected-unstable-complex-pairs 0
          cp "$KS1D_BUILD/project_full/0/debug_curve_stability_plot.dat" "$KS1D_BUILD/full_stability_plot.before_restart.dat"
          timeout 300s ./"$KS1D_BUILD"/KS1D_full_stability_cpu_omp.bin "$KS1D_BUILD/ks1d_full_ci.json" --quiet
          cmp "$KS1D_BUILD/full_stability_plot.before_restart.dat" "$KS1D_BUILD/project_full/0/debug_curve_stability_plot.dat"

      - name: Verify NMFD Newton selection, reference continuation, stability, deflation and unchanged restart
        run: |
          export OMP_NUM_THREADS=2 OMP_DYNAMIC=FALSE OPENBLAS_NUM_THREADS=1
          KS1D_BUILD="$BUILD_DIR/ks1d_full_cpu_omp"
          python3 scripts/test_ks1d_full_nmfd.py --bd-executable "$KS1D_BUILD/KS1D_full_bd_cpu_omp.bin" --stability-executable "$KS1D_BUILD/KS1D_full_stability_cpu_omp.bin" --work-dir "$KS1D_BUILD/nonzero_nmfd"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ks1d-full-newton-replay
          path: ${{ env.BUILD_DIR }}/ks1d_full_cpu_omp/nonzero_nmfd/*.log
          if-no-files-found: ignore

