  ks1d-sym-cpu-omp:
    needs: [continuation-core-cpu, fftw-operations-cpu, eigensolver-foundation-cpu, ks1d-nmfd-newton-cpu-omp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev libfftw3-dev libopenblas-dev
          fi
      - name: Build and validate symmetrized KS1D and its Jacobian/preconditioner adjoints
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            KS1D_OMP_THREADS="$(nproc)"
            if [ "$KS1D_OMP_THREADS" -gt 4 ]; then
              KS1D_OMP_THREADS=4
            fi
            export OMP_NUM_THREADS="$KS1D_OMP_THREADS"
          else
            export OMP_NUM_THREADS="${OMP_NUM_THREADS:-8}"
          fi
          export OMP_DYNAMIC=FALSE
          export OPENBLAS_NUM_THREADS=1
          echo "KS1D CI threads: OMP=$OMP_NUM_THREADS, OpenBLAS=$OPENBLAS_NUM_THREADS"
          KS1D_BUILD="$BUILD_DIR/ks1d_sym_cpu_omp"
          make KS1D_operator_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          ./"$KS1D_BUILD"/test_KS1D_operator_cpu_omp.bin
          make KS1D_bd_cpu_omp CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          python3 scripts/write_ks1d_ci_config.py "$KS1D_BUILD/ks1d_ci.json" "$KS1D_BUILD/project" --base-config json_project_files/KS1D_test_sym.json --clean-project --steps 6 --step-size 0.02 --max-step-size 0.03
