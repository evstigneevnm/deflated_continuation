            flags=""
            if [ "$precision" = double ]; then flags=-DUSE_DOUBLE_PRECISION; fi
            directory="$BUILD_DIR/common_dense_cuda_$precision"
            make -j2 test_common_nmfd_dense_gmres_cuda.bin test_common_nmfd_dense_direct_solver_cuda.bin test_common_nmfd_dense_nonlinear_solver_cuda.bin test_common_nmfd_dense_newton_direct_solver_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$directory" NEWTON_TEST_FLAGS="$flags"
            for test in gmres direct_solver nonlinear_solver newton_direct_solver; do
              timeout 90s ./"$directory"/test_common_nmfd_dense_"$test"_cuda.bin
            done
          done

