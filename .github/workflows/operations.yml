name: Operations

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  CONFIG_FILE: build_configs/config_omen_home_release.inc
  BUILD_DIR: build/local_ci_operations

defaults:
  run:
    shell: bash
    working-directory: Linsolver_test

jobs:
  cpu-vector-operations-var-prec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev
          fi
      - name: Build
        run: make test_cpu_vector_operations_var_prec.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR"
      - name: Test
        run: ./"$BUILD_DIR"/test_cpu_vector_operations_var_prec.bin

  scfd-vector-operations-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev
          fi
      - name: Build and test double
        run: |
          make scfd_vector_operations_cpu.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/scfd_cpu_double" REAL_TYPE=double
          ./"$BUILD_DIR"/scfd_cpu_double/test_scfd_vector_operations_cpu.bin
      - name: Build and test float
        run: |
          make scfd_vector_operations_cpu.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/scfd_cpu_float" REAL_TYPE=float
          ./"$BUILD_DIR"/scfd_cpu_float/test_scfd_vector_operations_cpu.bin

  fftw-operations-cpu:
    needs: [scfd-vector-operations-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libfftw3-dev
          fi
      - name: Build and test
        run: |
          make test_fftw_operations.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/fftw_operations"
          ./"$BUILD_DIR"/fftw_operations/test_fftw_operations.bin

  lapack-wrap-cpu:
    needs: [scfd-vector-operations-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libopenblas-dev
          fi
      - name: Build and test
        run: |
          make test_lapack_wrap.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/lapack_wrap"
          ./"$BUILD_DIR"/lapack_wrap/test_lapack_wrap.bin

  lapack-wrap-cuda:
    needs: [scfd-vector-operations-cuda, lapack-wrap-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build and test when CUDA is available
        run: |
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA LAPACK wrapper: nvidia-smi not found"
            exit 0
          fi
          if ! nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA LAPACK wrapper: nvidia-smi is present but no usable NVIDIA device was reported"
            exit 0
          fi
          if ! command -v nvcc >/dev/null 2>&1 && [ ! -x /usr/local/cuda/bin/nvcc ]; then
            echo "Skipping CUDA LAPACK wrapper: nvcc not found"
            exit 0
          fi
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libopenblas-dev
          fi
          make test_lapack_wrap_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/lapack_wrap_cuda"
          ./"$BUILD_DIR"/lapack_wrap_cuda/test_lapack_wrap_cuda.bin auto

  scfd-vector-operations-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build and test when CUDA is available
        run: |
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA vector operations: nvidia-smi not found"
            exit 0
          fi
          if ! nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA vector operations: nvidia-smi is present but no usable NVIDIA device was reported"
            exit 0
          fi
          if ! command -v nvcc >/dev/null 2>&1 && [ ! -x /usr/local/cuda/bin/nvcc ]; then
            echo "Skipping CUDA vector operations: nvcc not found"
            exit 0
          fi
          make scfd_vector_operations.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/scfd_cuda_double" REAL_TYPE=double
          ./"$BUILD_DIR"/scfd_cuda_double/test_scfd_vector_operations.bin auto
          make scfd_vector_operations.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/scfd_cuda_float" REAL_TYPE=float
          ./"$BUILD_DIR"/scfd_cuda_float/test_scfd_vector_operations.bin auto

  scfd-vector-operations-hip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build and test when HIP is available
        run: |
          HIPCC_BIN="${HIPCC:-hipcc}"
          if ! command -v "$HIPCC_BIN" >/dev/null 2>&1 && [ ! -x "$HIPCC_BIN" ]; then
            echo "Skipping HIP vector operations: hipcc not found"
            exit 0
          fi
          HIP_COMPILER_VERSION="$("$HIPCC_BIN" --version 2>/dev/null || true)"
          if echo "$HIP_COMPILER_VERSION" | grep -qi nvcc; then
            if ! command -v nvidia-smi >/dev/null 2>&1; then
              echo "Skipping HIP vector operations: HIP is configured for NVIDIA, but nvidia-smi was not found"
              exit 0
            fi
            if ! nvidia-smi >/dev/null 2>&1; then
              echo "Skipping HIP vector operations: HIP is configured for NVIDIA, but no usable NVIDIA device was reported"
              exit 0
            fi
          else
            if ! command -v rocm-smi >/dev/null 2>&1; then
              echo "Skipping HIP vector operations: rocm-smi not found"
              exit 0
            fi
            if ! rocm-smi >/dev/null 2>&1; then
              echo "Skipping HIP vector operations: rocm-smi is present but no usable ROCm device was reported"
              exit 0
            fi
          fi
          make scfd_vector_operations_hip.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/scfd_hip_double" REAL_TYPE=double HIPCC="$HIPCC_BIN"
          ./"$BUILD_DIR"/scfd_hip_double/test_scfd_vector_operations_hip.bin auto
          make scfd_vector_operations_hip.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/scfd_hip_float" REAL_TYPE=float HIPCC="$HIPCC_BIN"
          ./"$BUILD_DIR"/scfd_hip_float/test_scfd_vector_operations_hip.bin auto

  circle-bd-cpu-omp:
    needs: [scfd-vector-operations-cpu, fftw-operations-cpu, lapack-wrap-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev
          fi
      - name: Build and validate
        run: |
          export OMP_NUM_THREADS=8
          CIRCLE_BUILD="$BUILD_DIR/circle_bd_cpu_omp"
          make circle_bd_cpu_omp CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$CIRCLE_BUILD" REAL_TYPE=double
          python3 scripts/write_circle_ci_config.py "$CIRCLE_BUILD/circle_ci.json" "$CIRCLE_BUILD/project" --clean-project
          timeout 120s ./"$CIRCLE_BUILD"/circle_bd_cpu_omp.bin "$CIRCLE_BUILD/circle_ci.json" --analytical-solution --quiet
          python3 scripts/validate_circle_diagram.py "$CIRCLE_BUILD/project" --tolerance 1e-5 --min-points 8

  circle-bd-full-cpu-omp:
    needs: [scfd-vector-operations-cpu, fftw-operations-cpu, lapack-wrap-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev
          fi
      - name: Build and validate full closed circle
        run: |
          export OMP_NUM_THREADS=8
          CIRCLE_BUILD="$BUILD_DIR/circle_bd_full_cpu_omp"
          make circle_bd_cpu_omp CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$CIRCLE_BUILD" REAL_TYPE=double
          python3 scripts/write_circle_ci_config.py "$CIRCLE_BUILD/circle_full_ci.json" "$CIRCLE_BUILD/project" --clean-project --steps 340 --step-size 0.02 --max-step-size 0.04 --deflation-attempts 1 --continuation-fail-attempts 8 --knots -1.05 0.5 1.05
          timeout 120s ./"$CIRCLE_BUILD"/circle_bd_cpu_omp.bin "$CIRCLE_BUILD/circle_full_ci.json" --seed-exact-curve 0.5 -1 --quiet
          python3 scripts/validate_circle_diagram.py "$CIRCLE_BUILD/project" --tolerance 1e-5 --min-points 100 --expected-curves 1 --require-closed-circle --min-angle-coverage 6.0 --max-closure-distance 1e-10

  circle-bd-var-prec:
    needs: [cpu-vector-operations-var-prec, fftw-operations-cpu, lapack-wrap-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
