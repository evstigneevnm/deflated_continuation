            echo "Skipping CUDA vector operations: nvidia-smi not found"
            exit 0
          fi
          if ! nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA vector operations: nvidia-smi is present but no usable NVIDIA device was reported"
            exit 0
          fi
          if ! command -v nvcc >/dev/null 2>&1 && [ ! -x /usr/local/cuda/bin/nvcc ]; then
            echo "Skipping CUDA vector operations: nvcc not found"
            exit 0
          fi
          make scfd_vector_operations_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/scfd_cuda_double" REAL_TYPE=double
          ./"$BUILD_DIR"/scfd_cuda_double/test_scfd_vector_operations_cuda.bin auto
          make scfd_vector_operations_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/scfd_cuda_float" REAL_TYPE=float
          ./"$BUILD_DIR"/scfd_cuda_float/test_scfd_vector_operations_cuda.bin auto
          CUDA_COMPILER="$(command -v nvcc || printf '%s' /usr/local/cuda/bin/nvcc)"
          make -C source/contrib/scfd/test/utils test-scalar-traits-cuda \
            NVCC="$CUDA_COMPILER" BUILD_DIR="$GITHUB_WORKSPACE/$BUILD_DIR/scalar_traits_cuda"
          make -C source/contrib/nmfd-operations "$GITHUB_WORKSPACE/$BUILD_DIR/scalar_consumers_cuda/backend_cuda.bin" \
            NVCC="$CUDA_COMPILER" SCFD_ROOT="$SCFD_ROOT" BUILD_DIR="$GITHUB_WORKSPACE/$BUILD_DIR/scalar_consumers_cuda"
          ./"$BUILD_DIR"/scalar_consumers_cuda/backend_cuda.bin
          CUDA_SANITIZER="$(command -v compute-sanitizer || printf '%s' /usr/local/cuda/bin/compute-sanitizer)"
          if [ -x "$CUDA_SANITIZER" ]; then
            for real in double float; do
              timeout 180s "$CUDA_SANITIZER" --tool memcheck --leak-check full --error-exitcode 99 ./"$BUILD_DIR"/scfd_cuda_"$real"/test_scfd_vector_operations_cuda.bin auto
            done
          fi

  scfd-vector-operations-hip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Build and test when HIP is available
        run: |
          HIPCC_BIN="${HIPCC:-hipcc}"
          if ! command -v "$HIPCC_BIN" >/dev/null 2>&1 && [ ! -x "$HIPCC_BIN" ]; then
            echo "Skipping HIP vector operations: hipcc not found"
            exit 0
          fi
          HIP_COMPILER_VERSION="$("$HIPCC_BIN" --version 2>/dev/null || true)"
          if echo "$HIP_COMPILER_VERSION" | grep -qi nvcc; then
            if ! command -v nvidia-smi >/dev/null 2>&1; then
              echo "Skipping HIP vector operations: HIP is configured for NVIDIA, but nvidia-smi was not found"
              exit 0
            fi
            if ! nvidia-smi >/dev/null 2>&1; then
              echo "Skipping HIP vector operations: HIP is configured for NVIDIA, but no usable NVIDIA device was reported"
              exit 0
            fi
          else
            if ! command -v rocm-smi >/dev/null 2>&1; then
              echo "Skipping HIP vector operations: rocm-smi not found"
              exit 0
            fi
            if ! rocm-smi >/dev/null 2>&1; then
              echo "Skipping HIP vector operations: rocm-smi is present but no usable ROCm device was reported"
              exit 0
            fi
          fi
