  ks1d-full-nmfd-newton-cpu-omp:
    name: Full KS1D / NMFD Newton / ${{ matrix.compiler }}
    needs: [project-newton-assembly-cpu, project-newton-deflation-fixed-damping-cpu, fftw-operations-cpu]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KS1D_CI_COMPILER: ${{ matrix.compiler }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Prepare hosted CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make libfftw3-dev
            if [ "$KS1D_CI_COMPILER" = clang ]; then
              sudo apt-get install -y --no-install-recommends clang libomp-dev
            fi
          fi
      - name: Verify frozen charts, bordered correctors and tangents, orbit exclusion and rollback
        run: |
          export OMP_NUM_THREADS=2 OMP_DYNAMIC=FALSE OPENBLAS_NUM_THREADS=1
