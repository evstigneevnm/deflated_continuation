    needs: [timestepper-tables-explicit-cpu, timestepper-explicit-lorenz-cpu, timestepper-scipy-adaptation-cpu, timestepper-dop853-adaptive-cpu]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Prepare hosted CPU and Python dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy python3-matplotlib
          fi
      - name: Compare Lorenz trajectories with SciPy RK45, RK23 and DOP853
        run: |
          SIMULATION_BUILD="$BUILD_DIR/lorenz_simulation"
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            PYTHON=/usr/bin/python3
          else
            PYTHON=python3
            if ! "$PYTHON" -c 'import numpy, scipy, matplotlib' >/dev/null 2>&1; then
              PYTHON="$HOME/anaconda3/bin/python"
            fi
          fi
          export MPLCONFIGDIR="$SIMULATION_BUILD/matplotlib"
          "$PYTHON" source/contrib/nmfd-timesteppers/tests/test_compare_explicit_lorenz_simulation.py
          make test_explicit_lorenz_simulation_cpu.bin test_explicit_lorenz_simulation_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$SIMULATION_BUILD"
          for backend in cpu cpu_omp; do
            for method in RK45 RK23 DOP853; do
              for controller in matlab scipy; do
                if [ "$method" = DOP853 ] && [ "$controller" != scipy ]; then
                  continue
                fi
                TRAJECTORY="$SIMULATION_BUILD/lorenz_${backend}_${method}_${controller}.dat"
                OMP_NUM_THREADS=8 "$SIMULATION_BUILD/test_explicit_lorenz_simulation_${backend}.bin" 1 "$TRAJECTORY" "$method" "$controller"
                "$PYTHON" source/contrib/nmfd-timesteppers/tests/compare_explicit_lorenz_simulation.py "$TRAJECTORY"
              done
            done
          done
      - name: Save trajectories, comparisons, and plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timestepper-lorenz-simulation
          path: |
            ${{ env.BUILD_DIR }}/lorenz_simulation/*.dat
            ${{ env.BUILD_DIR }}/lorenz_simulation/*.json
            ${{ env.BUILD_DIR }}/lorenz_simulation/*.png

