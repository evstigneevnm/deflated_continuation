  ks1d-sym-cuda:
    needs: [eigensolver-foundation-cuda, fft-facade-cuda, ks1d-nmfd-newton-cuda]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Build and validate CUDA KS1D Jacobian/preconditioner adjoints when available
        run: |
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA KS1D: nvidia-smi not found"
            exit 0
          fi
          if ! nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA KS1D: nvidia-smi is present but no usable NVIDIA device was reported"
            exit 0
          fi
          if ! command -v nvcc >/dev/null 2>&1 && [ ! -x /usr/local/cuda/bin/nvcc ]; then
            echo "Skipping CUDA KS1D: nvcc not found"
            exit 0
          fi
          KS1D_BUILD="$BUILD_DIR/ks1d_sym_cuda"
          make KS1D_operator_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          ./"$KS1D_BUILD"/test_KS1D_operator_cuda.bin auto
          make test_KS1D_linear_solvers_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          ./"$KS1D_BUILD"/test_KS1D_linear_solvers_cuda.bin
          make KS1D_full_operator_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          ./"$KS1D_BUILD"/test_KS1D_full_operator_cuda.bin auto
          make test_KS1D_full_linear_solvers_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          ./"$KS1D_BUILD"/test_KS1D_full_linear_solvers_cuda.bin
          make KS1D_stability_scan_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          ./"$KS1D_BUILD"/test_KS1D_stability_scan_cuda.bin auto
          make KS1D_bd_cuda CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          python3 scripts/write_ks1d_ci_config.py "$KS1D_BUILD/ks1d_ci.json" "$KS1D_BUILD/project" --base-config json_project_files/KS1D_test_sym.json --clean-project --steps 12 --step-size 0.02 --max-step-size 0.03
          timeout 120s ./"$KS1D_BUILD"/KS1D_bd_cuda.bin "$KS1D_BUILD/ks1d_ci.json" --quiet auto
          python3 scripts/validate_ks1d_zero_branch.py "$KS1D_BUILD/project" --min-points 10 --expected-curves 1 --max-reduced-norm 1e-9 --min-lambda-span 0.2
          make KS1D_stability_cuda CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          timeout 120s ./"$KS1D_BUILD"/KS1D_stability_cuda.bin "$KS1D_BUILD/ks1d_ci.json" --quiet auto
          python3 scripts/validate_stability_diagram.py "$KS1D_BUILD/project" --expected-curves 1 --min-points 10 --require-complete --expected-point-type stable --expected-unstable-real 0 --expected-unstable-complex-pairs 0
          python3 scripts/test_ks1d_symmetric_nmfd.py --bd-executable "$KS1D_BUILD/KS1D_bd_cuda.bin" --stability-executable "$KS1D_BUILD/KS1D_stability_cuda.bin" --work-dir "$KS1D_BUILD/nonzero_replay" --device auto
          make KS1D_full_bd_cuda CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          python3 scripts/write_ks1d_ci_config.py "$KS1D_BUILD/ks1d_full_ci.json" "$KS1D_BUILD/project_full" --base-config json_project_files/KS1D_test_full.json --clean-project --steps 12 --step-size 0.02 --max-step-size 0.03
          timeout 120s ./"$KS1D_BUILD"/KS1D_full_bd_cuda.bin "$KS1D_BUILD/ks1d_full_ci.json" --quiet auto
          python3 scripts/validate_ks1d_zero_branch.py "$KS1D_BUILD/project_full" --min-points 10 --expected-curves 1 --max-reduced-norm 1e-9 --min-lambda-span 0.2
          make KS1D_full_stability_cuda CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          python3 scripts/test_ks1d_full_stability_replay.py --executable "$KS1D_BUILD/KS1D_full_stability_cuda.bin" --config json_project_files/KS1D_test_full.json --device auto --timeout "${KS1D_CUDA_REPLAY_TIMEOUT:-360}"
          timeout 120s ./"$KS1D_BUILD"/KS1D_full_stability_cuda.bin "$KS1D_BUILD/ks1d_full_ci.json" --quiet auto
          python3 scripts/validate_stability_diagram.py "$KS1D_BUILD/project_full" --expected-curves 1 --min-points 10 --require-complete --expected-point-type stable --expected-unstable-real 0 --expected-unstable-complex-pairs 0
          python3 scripts/test_ks1d_full_nmfd.py --bd-executable "$KS1D_BUILD/KS1D_full_bd_cuda.bin" --stability-executable "$KS1D_BUILD/KS1D_full_stability_cuda.bin" --work-dir "$KS1D_BUILD/nonzero_full_nmfd" --device auto

  ks1d-sym-hip:
    name: Symmetric KS1D / HIP FFT, operators and Newton
    needs: [project-newton-assembly-cpu, ks1d-nmfd-newton-cpu-omp]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Verify HIP numerics when the compiler, hipFFT and a GPU are available
        run: |
          HIPCC_BIN="$(command -v "${HIPCC:-hipcc}" || true)"
          if [ -z "$HIPCC_BIN" ]; then
            echo "Skipping HIP KS1D: hipcc not found"
            exit 0
          fi
          HIP_ROOT="${ROCM_PATH:-$(dirname "$(dirname "$HIPCC_BIN")")}"
          if [ ! -f "$HIP_ROOT/include/hipfft/hipfft.h" ]; then
            echo "Skipping HIP KS1D: hipFFT development files not found"
            exit 0
          fi
          if "$HIPCC_BIN" --version | grep -qi nvcc; then
            if ! nvidia-smi -L >/dev/null 2>&1; then
              echo "Skipping HIP KS1D: no usable NVIDIA GPU"
              exit 0
            fi
            HIP_TARGET="${HIP_ARCH_LIST:-75}"
          else
            if ! "$HIP_ROOT/bin/rocm-smi" >/dev/null 2>&1; then
              echo "Skipping HIP KS1D: no usable AMD GPU"
              exit 0
            fi
            HIP_TARGET="${HIP_ARCH_LIST:-native}"
          fi
          KS1D_BUILD="$BUILD_DIR/ks1d_sym_hip"
          make test_fft_facade_hipfft.bin KS1D_operator_hip.bin test_KS1D_newton_hip.bin \
            CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double \
            HIPCC="$HIPCC_BIN" HIP_ROOT_PATH="$HIP_ROOT" HIP_PATH="$HIP_ROOT" HIP_ARCH_LIST="$HIP_TARGET"
          timeout 120s ./"$KS1D_BUILD"/test_fft_facade_hipfft.bin auto
          timeout 120s ./"$KS1D_BUILD"/test_KS1D_operator_hip.bin auto
          timeout 120s ./"$KS1D_BUILD"/test_KS1D_newton_hip.bin

