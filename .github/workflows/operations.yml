            if ! nvidia-smi >/dev/null 2>&1; then
              echo "Skipping HIP star_shaped_bd: HIP is configured for NVIDIA, but no usable NVIDIA device was reported"
              exit 0
            fi
          else
            if ! command -v rocm-smi >/dev/null 2>&1; then
              echo "Skipping HIP star_shaped_bd: rocm-smi not found"
              exit 0
            fi
            if ! rocm-smi >/dev/null 2>&1; then
              echo "Skipping HIP star_shaped_bd: rocm-smi is present but no usable ROCm device was reported"
              exit 0
            fi
          fi
          STAR_BUILD="$BUILD_DIR/star_shaped_bd_hip"
          make star_shaped_bd_hip CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$STAR_BUILD" REAL_TYPE=double HIPCC="$HIPCC_BIN"
          python3 scripts/write_star_shaped_ci_config.py "$STAR_BUILD/star_shaped_ci.json" "$STAR_BUILD/project" --clean-project --curvature 0.3
          timeout 120s ./"$STAR_BUILD"/star_shaped_bd_hip.bin "$STAR_BUILD/star_shaped_ci.json" --seed-exact 0.25 --continue-seed-only --quiet
          python3 scripts/validate_star_shaped_diagram.py "$STAR_BUILD/project" --config "$STAR_BUILD/star_shaped_ci.json" --residual-tolerance 1e-5 --min-points 100 --expected-curves 1 --require-closed-star --min-angle-coverage 6.0 --max-closure-distance 5e-2
