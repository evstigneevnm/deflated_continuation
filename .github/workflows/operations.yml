  fourier-discretization-cuda:
    needs: [scfd-vector-operations-cuda, fft-facade-cuda, eigensolver-foundation-cuda]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Build and validate CUDA Fourier and KS2D adjoint operators when available
        run: |
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA Fourier discretization: nvidia-smi not found"
            exit 0
          fi
          if ! nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA Fourier discretization: no usable NVIDIA device"
            exit 0
          fi
          if ! command -v nvcc >/dev/null 2>&1 && [ ! -x /usr/local/cuda/bin/nvcc ]; then
            echo "Skipping CUDA Fourier discretization: nvcc not found"
            exit 0
          fi
          KS2D_BUILD="$BUILD_DIR/ks2d_cuda"
          make test_fourier_discretization_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS2D_BUILD" REAL_TYPE=double
          ./"$KS2D_BUILD"/test_fourier_discretization_cuda.bin
          make test_fourier_translation_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS2D_BUILD" REAL_TYPE=double
          ./"$KS2D_BUILD"/test_fourier_translation_cuda.bin
          make test_KS2D_operator_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS2D_BUILD" REAL_TYPE=double
          ./"$KS2D_BUILD"/test_KS2D_operator_cuda.bin
          make test_KS2D_linear_solvers_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS2D_BUILD" REAL_TYPE=double
          ./"$KS2D_BUILD"/test_KS2D_linear_solvers_cuda.bin
          make test_numpy_array_writer.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS2D_BUILD" REAL_TYPE=double
          ./"$KS2D_BUILD"/test_numpy_array_writer.bin
          make KS2D_bd_cuda CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS2D_BUILD" REAL_TYPE=double
          python3 scripts/write_ks2d_ci_config.py "$KS2D_BUILD/ks2d_ci.json" "$KS2D_BUILD/project" --clean-project --nx 12 --ny 12 --steps 8
          timeout 120s ./"$KS2D_BUILD"/KS2D_bd_cuda.bin "$KS2D_BUILD/ks2d_ci.json" --seed-zero 2.0 --continue-seed-only --quiet auto
          python3 scripts/validate_symmetry_group_manifest.py "$KS2D_BUILD/project" --expected-order 8
          python3 scripts/validate_ks1d_zero_branch.py "$KS2D_BUILD/project" --min-points 10 --expected-curves 1 --max-reduced-norm 1e-9 --min-lambda-span 0.2
          make KS2D_prepare_visualization_cuda CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS2D_BUILD" REAL_TYPE=double
          ./"$KS2D_BUILD"/KS2D_prepare_visualization_cuda.bin "$KS2D_BUILD/ks2d_ci.json" --output-dir "$KS2D_BUILD/visualization" --branch 0 --max-points 1 --quiet auto
          python3 scripts/validate_ks2d_visualization.py "$KS2D_BUILD/visualization/manifest.jsonl" --nx 12 --ny 12 --expected-backend scfd_cuda_cufft --maximum-absolute-value 1e-12
          make KS2D_stability_cuda CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS2D_BUILD" REAL_TYPE=double
          timeout 180s ./"$KS2D_BUILD"/KS2D_stability_cuda.bin "$KS2D_BUILD/ks2d_ci.json" --quiet auto
          python3 scripts/validate_stability_diagram.py "$KS2D_BUILD/project" --expected-curves 1 --min-points 10 --require-complete --require-plot-sidecar --expected-point-type stable --expected-unstable-real 0 --expected-unstable-complex-pairs 0
          KS2D_REPLAY_OUTPUT=$(timeout 180s ./"$KS2D_BUILD"/KS2D_stability_cuda.bin "$KS2D_BUILD/ks2d_ci.json" --state-file "$KS2D_BUILD/project/0/1" --parameter 30 --quiet auto)
          printf '%s\n' "$KS2D_REPLAY_OUTPUT"
          grep -Fq 'unstable=(10,0)' <<<"$KS2D_REPLAY_OUTPUT"
          python3 scripts/write_ks2d_ci_config.py "$KS2D_BUILD/ks2d_nontrivial_ci.json" "$KS2D_BUILD/project_nontrivial" --clean-project --nx 12 --ny 16 --steps 20 --step-size 2 --max-step-size 5 --skip-file-output 5 --seed-parameter 4.333 --parameter-min 3.99 --parameter-max 4.4 --deflation-attempts 1 --newton-deflation-iterations 80 --newton-deflation-weight 0.5 --newton-deflation-tolerance 1e-8 --linear-solver-iterations 150 --linear-solver-tolerance 1e-3 --add-analytical-solution --enable-branch-intersections --enable-seed-schedule --max-failed-continuations-per-knot 1
          timeout 120s ./"$KS2D_BUILD"/KS2D_bd_cuda.bin "$KS2D_BUILD/ks2d_nontrivial_ci.json" --quiet auto
          python3 scripts/validate_ks2d_nontrivial_branch.py "$KS2D_BUILD/project_nontrivial" --seed-parameter 4.333 --minimum-norm 1e-3
          python3 scripts/test_ks2d_nmfd.py --bd-executable "$KS2D_BUILD/KS2D_bd_cuda.bin" --stability-executable "$KS2D_BUILD/KS2D_stability_cuda.bin" --work-dir "$KS2D_BUILD/nonzero_nmfd" --device auto

