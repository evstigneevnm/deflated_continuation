name: Operations

on:
  workflow_dispatch:
  push:
  pull_request:

env:
  CONFIG_FILE: build_configs/config_omen_home_release.inc
  BUILD_DIR: build/local_ci_operations

defaults:
  run:
    shell: bash

jobs:
  cpu-vector-operations-var-prec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev
          fi
      - name: Build
        run: make test_cpu_vector_operations_var_prec.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR"
      - name: Test
        run: ./"$BUILD_DIR"/test_cpu_vector_operations_var_prec.bin

  scfd-vector-operations-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev
          fi
      - name: Build and test double
        run: |
          make scfd_vector_operations_cpu.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/scfd_cpu_double" REAL_TYPE=double
          ./"$BUILD_DIR"/scfd_cpu_double/test_scfd_vector_operations_cpu.bin
      - name: Build and test float
        run: |
          make scfd_vector_operations_cpu.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/scfd_cpu_float" REAL_TYPE=float
          ./"$BUILD_DIR"/scfd_cpu_float/test_scfd_vector_operations_cpu.bin

  continuation-core-cpu:
    needs: [scfd-vector-operations-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3
          fi
      - name: Build and test continuation chart helpers
        run: |
          make test_continuation_chart_helpers.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/continuation_chart_helpers"
          ./"$BUILD_DIR"/continuation_chart_helpers/test_continuation_chart_helpers.bin
      - name: Build and test predictor chart validation
        run: |
          make test_predictor_chart_validation.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/predictor_chart_validation"
          ./"$BUILD_DIR"/predictor_chart_validation/test_predictor_chart_validation.bin

  symmetry-foundation-cpu:
    needs: [scfd-vector-operations-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3
          fi
      - name: Build and test
        run: |
          make test_small_dense_linalg.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/small_dense_linalg"
          ./"$BUILD_DIR"/small_dense_linalg/test_small_dense_linalg.bin
          make test_complex_traits.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/complex_traits"
          ./"$BUILD_DIR"/complex_traits/test_complex_traits.bin
          make test_fourier_mode_primitives.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/fourier_mode_primitives"
          ./"$BUILD_DIR"/fourier_mode_primitives/test_fourier_mode_primitives.bin
          make test_quotient_classifier.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/quotient_classifier"
          ./"$BUILD_DIR"/quotient_classifier/test_quotient_classifier.bin
          make test_fourier_slice_1d.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/fourier_slice_1d"
          ./"$BUILD_DIR"/fourier_slice_1d/test_fourier_slice_1d.bin
          make test_real_packed_fourier_canonical_adapter.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/real_packed_fourier_canonical_adapter"
          ./"$BUILD_DIR"/real_packed_fourier_canonical_adapter/test_real_packed_fourier_canonical_adapter.bin
          make test_fourier_slice_differential_1d.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/fourier_slice_differential_1d"
          ./"$BUILD_DIR"/fourier_slice_differential_1d/test_fourier_slice_differential_1d.bin
          make test_stabilized_storage.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/stabilized_storage"
          ./"$BUILD_DIR"/stabilized_storage/test_stabilized_storage.bin
          make test_symmetry_solution_storage.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/symmetry_solution_storage" REAL_TYPE=double
          ./"$BUILD_DIR"/symmetry_solution_storage/test_symmetry_solution_storage.bin

  fftw-operations-cpu:
    needs: [symmetry-foundation-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libfftw3-dev
          fi
      - name: Build and test
        run: |
          make test_fftw_operations.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/fftw_operations"
          ./"$BUILD_DIR"/fftw_operations/test_fftw_operations.bin
          make test_fft_facade_fftw.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/fft_facade_fftw"
          ./"$BUILD_DIR"/fft_facade_fftw/test_fft_facade_fftw.bin

  lapack-wrap-cpu:
    needs: [scfd-vector-operations-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libopenblas-dev
          fi
      - name: Build and test
        run: |
          make test_lapack_wrap.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/lapack_wrap"
          ./"$BUILD_DIR"/lapack_wrap/test_lapack_wrap.bin

  lapack-wrap-cuda:
    needs: [scfd-vector-operations-cuda, lapack-wrap-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build and test when CUDA is available
        run: |
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA LAPACK wrapper: nvidia-smi not found"
            exit 0
          fi
          if ! nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA LAPACK wrapper: nvidia-smi is present but no usable NVIDIA device was reported"
            exit 0
          fi
          if ! command -v nvcc >/dev/null 2>&1 && [ ! -x /usr/local/cuda/bin/nvcc ]; then
            echo "Skipping CUDA LAPACK wrapper: nvcc not found"
            exit 0
          fi
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libopenblas-dev
          fi
          make test_lapack_wrap_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/lapack_wrap_cuda"
          ./"$BUILD_DIR"/lapack_wrap_cuda/test_lapack_wrap_cuda.bin auto

  scfd-vector-operations-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build and test when CUDA is available
        run: |
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA vector operations: nvidia-smi not found"
            exit 0
          fi
          if ! nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA vector operations: nvidia-smi is present but no usable NVIDIA device was reported"
            exit 0
          fi
          if ! command -v nvcc >/dev/null 2>&1 && [ ! -x /usr/local/cuda/bin/nvcc ]; then
            echo "Skipping CUDA vector operations: nvcc not found"
            exit 0
          fi
          make scfd_vector_operations_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/scfd_cuda_double" REAL_TYPE=double
          ./"$BUILD_DIR"/scfd_cuda_double/test_scfd_vector_operations_cuda.bin auto
          make scfd_vector_operations_cuda.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/scfd_cuda_float" REAL_TYPE=float
          ./"$BUILD_DIR"/scfd_cuda_float/test_scfd_vector_operations_cuda.bin auto

  scfd-vector-operations-hip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build and test when HIP is available
        run: |
          HIPCC_BIN="${HIPCC:-hipcc}"
          if ! command -v "$HIPCC_BIN" >/dev/null 2>&1 && [ ! -x "$HIPCC_BIN" ]; then
            echo "Skipping HIP vector operations: hipcc not found"
            exit 0
          fi
          HIP_COMPILER_VERSION="$("$HIPCC_BIN" --version 2>/dev/null || true)"
          if echo "$HIP_COMPILER_VERSION" | grep -qi nvcc; then
            if ! command -v nvidia-smi >/dev/null 2>&1; then
              echo "Skipping HIP vector operations: HIP is configured for NVIDIA, but nvidia-smi was not found"
              exit 0
            fi
            if ! nvidia-smi >/dev/null 2>&1; then
              echo "Skipping HIP vector operations: HIP is configured for NVIDIA, but no usable NVIDIA device was reported"
              exit 0
            fi
          else
            if ! command -v rocm-smi >/dev/null 2>&1; then
              echo "Skipping HIP vector operations: rocm-smi not found"
              exit 0
            fi
            if ! rocm-smi >/dev/null 2>&1; then
              echo "Skipping HIP vector operations: rocm-smi is present but no usable ROCm device was reported"
              exit 0
            fi
          fi
          make scfd_vector_operations_hip.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/scfd_hip_double" REAL_TYPE=double HIPCC="$HIPCC_BIN"
          ./"$BUILD_DIR"/scfd_hip_double/test_scfd_vector_operations_hip.bin auto
          make scfd_vector_operations_hip.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/scfd_hip_float" REAL_TYPE=float HIPCC="$HIPCC_BIN"
          ./"$BUILD_DIR"/scfd_hip_float/test_scfd_vector_operations_hip.bin auto

  fft-facade-cuda:
    needs: [scfd-vector-operations-cuda]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build and test when CUDA is available
        run: |
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA FFT facade: nvidia-smi not found"
            exit 0
          fi
          if ! nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA FFT facade: nvidia-smi is present but no usable NVIDIA device was reported"
            exit 0
          fi
          if ! command -v nvcc >/dev/null 2>&1 && [ ! -x /usr/local/cuda/bin/nvcc ]; then
            echo "Skipping CUDA FFT facade: nvcc not found"
            exit 0
          fi
          make test_fft_facade_cufft.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BUILD_DIR/fft_facade_cufft" REAL_TYPE=double
          ./"$BUILD_DIR"/fft_facade_cufft/test_fft_facade_cufft.bin auto

  ks1d-sym-cpu-omp:
    needs: [scfd-vector-operations-cpu, continuation-core-cpu, fftw-operations-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev libfftw3-dev
          fi
      - name: Build and validate symmetrized KS1D
        run: |
          export OMP_NUM_THREADS=8
          KS1D_BUILD="$BUILD_DIR/ks1d_sym_cpu_omp"
          make KS1D_operator_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          ./"$KS1D_BUILD"/test_KS1D_operator_cpu_omp.bin
          make KS1D_full_operator_cpu_omp.bin CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          ./"$KS1D_BUILD"/test_KS1D_full_operator_cpu_omp.bin
          make KS1D_bd_cpu_omp CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          python3 scripts/write_ks1d_ci_config.py "$KS1D_BUILD/ks1d_ci.json" "$KS1D_BUILD/project" --clean-project --steps 12 --step-size 0.02 --max-step-size 0.03
          timeout 120s ./"$KS1D_BUILD"/KS1D_bd_cpu_omp.bin "$KS1D_BUILD/ks1d_ci.json" --quiet
          python3 scripts/validate_ks1d_zero_branch.py "$KS1D_BUILD/project" --min-points 10 --expected-curves 1 --max-reduced-norm 1e-9 --min-lambda-span 0.2
          make KS1D_full_bd_cpu_omp CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$KS1D_BUILD" REAL_TYPE=double
          python3 scripts/write_ks1d_ci_config.py "$KS1D_BUILD/ks1d_full_ci.json" "$KS1D_BUILD/project_full" --clean-project --steps 12 --step-size 0.02 --max-step-size 0.03
          timeout 120s ./"$KS1D_BUILD"/KS1D_full_bd_cpu_omp.bin "$KS1D_BUILD/ks1d_full_ci.json" --quiet
          python3 scripts/validate_ks1d_zero_branch.py "$KS1D_BUILD/project_full" --min-points 10 --expected-curves 1 --max-reduced-norm 1e-9 --min-lambda-span 0.2

  circle-bd-cpu-omp:
    needs: [scfd-vector-operations-cpu, fftw-operations-cpu, lapack-wrap-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev
          fi
      - name: Build and validate
        run: |
          export OMP_NUM_THREADS=8
          CIRCLE_BUILD="$BUILD_DIR/circle_bd_cpu_omp"
          make circle_bd_cpu_omp CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$CIRCLE_BUILD" REAL_TYPE=double
          python3 scripts/write_circle_ci_config.py "$CIRCLE_BUILD/circle_ci.json" "$CIRCLE_BUILD/project" --clean-project
          timeout 120s ./"$CIRCLE_BUILD"/circle_bd_cpu_omp.bin "$CIRCLE_BUILD/circle_ci.json" --analytical-solution --quiet
          python3 scripts/validate_circle_diagram.py "$CIRCLE_BUILD/project" --tolerance 1e-5 --min-points 8

  circle-bd-full-cpu-omp:
    needs: [scfd-vector-operations-cpu, fftw-operations-cpu, lapack-wrap-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev
          fi
      - name: Build and validate full closed circle
        run: |
          export OMP_NUM_THREADS=8
          CIRCLE_BUILD="$BUILD_DIR/circle_bd_full_cpu_omp"
          make circle_bd_cpu_omp CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$CIRCLE_BUILD" REAL_TYPE=double
          python3 scripts/write_circle_ci_config.py "$CIRCLE_BUILD/circle_full_ci.json" "$CIRCLE_BUILD/project" --clean-project --steps 340 --step-size 0.02 --max-step-size 0.04 --deflation-attempts 1 --continuation-fail-attempts 8 --knots -1.05 0.5 1.05
          timeout 120s ./"$CIRCLE_BUILD"/circle_bd_cpu_omp.bin "$CIRCLE_BUILD/circle_full_ci.json" --seed-exact-curve 0.5 -1 --quiet
          python3 scripts/validate_circle_diagram.py "$CIRCLE_BUILD/project" --tolerance 1e-5 --min-points 100 --expected-curves 1 --require-closed-circle --min-angle-coverage 6.0 --max-closure-distance 1e-10

  circle-bd-var-prec:
    needs: [cpu-vector-operations-var-prec, fftw-operations-cpu, lapack-wrap-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev
          fi
      - name: Build and validate
        run: |
          CIRCLE_BUILD="$BUILD_DIR/circle_bd_var_prec"
          make circle_bd_var_prec CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$CIRCLE_BUILD"
          python3 scripts/write_circle_ci_config.py "$CIRCLE_BUILD/circle_ci.json" "$CIRCLE_BUILD/project" --clean-project
          timeout 120s ./"$CIRCLE_BUILD"/circle_bd_var_prec.bin "$CIRCLE_BUILD/circle_ci.json" --analytical-solution --quiet
          python3 scripts/validate_circle_diagram.py "$CIRCLE_BUILD/project" --tolerance 1e-5 --min-points 8

  star-shaped-bd-cpu-omp:
    needs: [scfd-vector-operations-cpu, fftw-operations-cpu, lapack-wrap-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev
          fi
      - name: Build and validate full closed star
        run: |
          export OMP_NUM_THREADS=8
          STAR_BUILD="$BUILD_DIR/star_shaped_bd_cpu_omp"
          make star_shaped_bd_cpu_omp CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$STAR_BUILD" REAL_TYPE=double
          python3 scripts/write_star_shaped_ci_config.py "$STAR_BUILD/star_shaped_ci.json" "$STAR_BUILD/project" --clean-project --curvature 0.3
          timeout 120s ./"$STAR_BUILD"/star_shaped_bd_cpu_omp.bin "$STAR_BUILD/star_shaped_ci.json" --seed-exact 0.25 --continue-seed-only --quiet
          python3 scripts/validate_star_shaped_diagram.py "$STAR_BUILD/project" --config "$STAR_BUILD/star_shaped_ci.json" --residual-tolerance 1e-5 --min-points 100 --expected-curves 1 --require-closed-star --min-angle-coverage 6.0 --max-closure-distance 5e-2

  star-shaped-bd-var-prec:
    needs: [cpu-vector-operations-var-prec, fftw-operations-cpu, lapack-wrap-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev
          fi
      - name: Build and validate full closed star
        run: |
          STAR_BUILD="$BUILD_DIR/star_shaped_bd_var_prec"
          make star_shaped_bd_var_prec CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$STAR_BUILD"
          python3 scripts/write_star_shaped_ci_config.py "$STAR_BUILD/star_shaped_ci.json" "$STAR_BUILD/project" --clean-project --curvature 0.3
          timeout 120s ./"$STAR_BUILD"/star_shaped_bd_var_prec.bin "$STAR_BUILD/star_shaped_ci.json" --seed-exact 0.25 --continue-seed-only --quiet
          python3 scripts/validate_star_shaped_diagram.py "$STAR_BUILD/project" --config "$STAR_BUILD/star_shaped_ci.json" --residual-tolerance 1e-5 --min-points 100 --expected-curves 1 --require-closed-star --min-angle-coverage 6.0 --max-closure-distance 5e-2

  bratu-bd-cpu-omp:
    needs: [scfd-vector-operations-cpu, fftw-operations-cpu, lapack-wrap-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev
          fi
      - name: Build and validate seeded fold continuation
        run: |
          export OMP_NUM_THREADS=8
          BRATU_BUILD="$BUILD_DIR/bratu_bd_cpu_omp"
          make bratu_bd_cpu_omp CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BRATU_BUILD" REAL_TYPE=double
          python3 scripts/write_bratu_ci_config.py "$BRATU_BUILD/bratu_ci.json" "$BRATU_BUILD/project" --clean-project
          timeout 120s ./"$BRATU_BUILD"/bratu_bd_cpu_omp.bin "$BRATU_BUILD/bratu_ci.json" --seed-exact-theta 1.0 --continue-seed-only --quiet
          python3 scripts/validate_bratu_diagram.py "$BRATU_BUILD/project" --config "$BRATU_BUILD/bratu_ci.json" --residual-tolerance 1e-5 --relation-tolerance 1e-2 --min-points 20 --min-saved-points 20 --expected-curves 1 --require-fold --min-max-u 2.0

  bratu-bd-fd3-cpu-omp:
    needs: [scfd-vector-operations-cpu, fftw-operations-cpu, lapack-wrap-cpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Prepare hosted Ubuntu CPU dependencies
        run: |
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            echo "CONFIG_FILE=build_configs/config_github_ubuntu_cpu.inc" >> "$GITHUB_ENV"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential make python3 libboost-dev libboost-serialization-dev
          fi
      - name: Build and validate FD3 seeded fold continuation
        run: |
          export OMP_NUM_THREADS=8
          BRATU_BUILD="$BUILD_DIR/bratu_bd_fd3_cpu_omp"
          make bratu_bd_cpu_omp CONFIG_FILE="$CONFIG_FILE" BUILD_DIR="$BRATU_BUILD" REAL_TYPE=double
          python3 scripts/write_bratu_ci_config.py "$BRATU_BUILD/bratu_ci.json" "$BRATU_BUILD/project" --clean-project --spatial-discretization fd3
          timeout 120s ./"$BRATU_BUILD"/bratu_bd_cpu_omp.bin "$BRATU_BUILD/bratu_ci.json" --seed-exact-theta 1.0 --continue-seed-only --quiet
