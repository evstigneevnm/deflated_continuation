      - name: Build and test when CUDA is available
        run: |
          if ! command -v nvidia-smi >/dev/null 2>&1; then
            echo "Skipping CUDA vector operations: nvidia-smi not found"
            exit 0
          fi
          if ! nvidia-smi >/dev/null 2>&1; then
